[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siper-ai"
version = "0.1.0"
description = "Sel icin proaktif erken risk yonetimi karar destek MVP'si"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "networkx>=3.2,<4",
  "pydantic>=2.7,<3",
  "streamlit>=1.39,<2",
  "pandas>=2.2,<4",
  "plotly>=5.24,<7",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
hydraulic = ["pyswmm==1.5.0", "swmm-toolkit==0.15.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
